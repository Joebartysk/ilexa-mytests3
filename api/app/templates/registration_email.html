<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Verifica tu Cuenta</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: #f4f4f4;
			margin: 0;
			padding: 0;
		}
		.container {
			max-width: 600px;
			margin: 20px auto;
			background-color: #ffffff;
			padding: 20px;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
		}
		h1 {
			color: #333333;
		}
		p {
			color: #666666;
		}
		.button {
			display: inline-block;
			padding: 10px 20px;
			background-color: #007BFF;
			color: #ffffff;
			text-decoration: none;
			border-radius: 5px;
		}
		.footer {
			margin-top: 20px;
			font-size: 0.9em;
			color: #999999;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>¡Hola {{ username }}!</h1>
		<p>Gracias por registrarte en nuestra plataforma.</p>
		<p>Para completar tu registro, haz clic en el siguiente botón:</p>
		<a href="{{ verification_url }}" class="button">Verificar Mi Cuenta</a>
		<div class="footer">
			<p>Si no solicitaste este correo, por favor ignóralo.</p>
			<p>&copy; {{ year }} {{ company_name }} Todos los derechos reservados.</p>
		</div>
	</div>
</body>
</html>
